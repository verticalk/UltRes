[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultres"
version = "0.1.0"
description = "UltRes — lightweight self-researching local LLM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "UltRes" }]
dependencies = [
    "chromadb>=0.5.20",
    "httpx>=0.27",
    "playwright>=1.47",
    "trafilatura>=1.12",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tenacity>=8.5",
    "psutil>=5.9",
    "tomli>=2.0; python_version<'3.11'",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
# Required for actual model loading + inference. Separated because
# llama-cpp-python compiles C++ from source and needs a toolchain (MSVC on
# Windows, gcc/clang on Linux). Install with: pip install -e ".[inference]"
inference = ["llama-cpp-python>=0.3.1"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
ultres = "ultres.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["ultres*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
