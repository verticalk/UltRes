[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ultres"
version = "1.6.0"
description = "UltRes — lightweight self-researching local LLM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "UltRes" }]
dependencies = [
    "chromadb>=0.5.20",
    "httpx>=0.27",
    "playwright>=1.47",
    "trafilatura>=1.12",
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "tenacity>=8.5",
    "psutil>=5.9",
    "tomli>=2.0; python_version<'3.11'",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
# Required for actual model loading + inference. Separated because
# llama-cpp-python compiles C++ from source and needs a toolchain (MSVC on
# Windows, gcc/clang on Linux). Install with: pip install -e ".[inference]"
# v1.5: 0.3.35+ required for Qwen3.8 hybrid attention (Gated DeltaNet).
inference = ["llama-cpp-python>=0.3.35"]
# CUDA-accelerated inference (NVIDIA GPU). Uses prebuilt wheel — no compiler needed.
# Install with: pip install -e ".[inference-cuda]"
# Or directly: pip install llama-cpp-python==0.3.35 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cu125 --force-reinstall --no-deps
# Plus CUDA runtime: pip install nvidia-cuda-runtime-cu12==12.4.127 nvidia-cublas-cu12==12.4.5.8 nvidia-cuda-nvrtc-cu12==12.4.127
# Note: cu124 wheel crashes with STATUS_ILLEGAL_INSTRUCTION — use cu125.
inference-cuda = ["llama-cpp-python>=0.3.35"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
ultres = "ultres.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["ultres*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
